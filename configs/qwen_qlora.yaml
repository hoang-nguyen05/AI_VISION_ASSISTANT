model:
  name: "Qwen/Qwen2-VL-2B-Instruct"
  torch_dtype: "bfloat16"
  load_in_4bit: true
  quant_type: "nf4"
  double_quant: true
  freeze_vision: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "checkpoints/qwen_qlora"
  adapter_dir: "adapters/qwen_vietnamese_qlora"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  fp16: false
  bf16: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 100
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  seed: 42

data:
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"
  max_pixels: 262144 # 512x512
  min_pixels: 3136
  max_length: 768
